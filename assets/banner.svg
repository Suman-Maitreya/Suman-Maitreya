<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="55%" stop-color="#141A3F"/>
      <stop offset="100%" stop-color="#2A1458"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .title { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .sub { font-family: 'Consolas', 'SF Mono', 'Menlo', 'Courier New', monospace; letter-spacing: 3px; }
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .wave { stroke-dasharray: 8 6; animation: flow 6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -140; } }
      .fade { animation: fadeIn 1.6s ease-out both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>

  <!-- Neural network motif (left) -->
  <g stroke="#7DD3FC" stroke-opacity="0.25" stroke-width="1">
    <line x1="70" y1="90" x2="150" y2="60"/><line x1="70" y1="90" x2="150" y2="130"/>
    <line x1="70" y1="170" x2="150" y2="130"/><line x1="70" y1="170" x2="150" y2="200"/>
    <line x1="70" y1="250" x2="150" y2="200"/><line x1="70" y1="250" x2="150" y2="270"/>
    <line x1="150" y1="60" x2="220" y2="130"/><line x1="150" y1="130" x2="220" y2="130"/>
    <line x1="150" y1="200" x2="220" y2="200"/><line x1="150" y1="270" x2="220" y2="200"/>
    <line x1="150" y1="130" x2="220" y2="200"/><line x1="150" y1="200" x2="220" y2="130"/>
  </g>
  <g fill="#7DD3FC">
    <circle class="node" cx="70" cy="90" r="4"/><circle class="node n2" cx="70" cy="170" r="4"/><circle class="node n3" cx="70" cy="250" r="4"/>
    <circle class="node n3" cx="150" cy="60" r="4"/><circle class="node" cx="150" cy="130" r="4"/>
    <circle class="node n2" cx="150" cy="200" r="4"/><circle class="node" cx="150" cy="270" r="4"/>
    <circle class="node n2" cx="220" cy="130" r="5"/><circle class="node n3" cx="220" cy="200" r="5"/>
  </g>

  <!-- Qubit / Bloch sphere motif (right) -->
  <g transform="translate(1060,160)" fill="none" stroke="#F0ABFC" stroke-opacity="0.45" stroke-width="1.2">
    <circle r="70"/>
    <ellipse rx="70" ry="22"/>
    <ellipse rx="22" ry="70" stroke-opacity="0.2"/>
    <line x1="0" y1="0" x2="38" y2="-52" stroke="#F0ABFC" stroke-opacity="0.9" stroke-width="2"/>
    <circle class="node" cx="38" cy="-52" r="5" fill="#F0ABFC" stroke="none"/>
    <text x="-8" y="-78" fill="#F0ABFC" fill-opacity="0.7" stroke="none" class="sub" font-size="13">|0⟩</text>
    <text x="-8" y="92" fill="#F0ABFC" fill-opacity="0.7" stroke="none" class="sub" font-size="13">|1⟩</text>
  </g>

  <!-- Name and subtitle -->
  <g class="fade">
    <text x="600" y="148" text-anchor="middle" class="title" font-size="58" fill="url(#name)">Suman Maitreya M</text>
    <text x="600" y="192" text-anchor="middle" class="sub" font-size="15" fill="#CBD5E1">AI &amp; DATA SCIENCE · DEEP LEARNING · QUANTUM · BIG DATA</text>
  </g>

  <!-- Signal wave -->
  <path class="wave" d="M300 250 C 360 220, 420 280, 480 250 S 600 220, 660 250 S 780 280, 840 250 S 900 230, 920 250"
        fill="none" stroke="url(#wave)" stroke-width="2.2"/>
</svg>
